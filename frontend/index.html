<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/icon-512.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Carbon & Whale · — inventory management for metro and mall bench advertising assets: visible interest queues, business-day expiry, geo-tagged proof cycles and an immutable audit trail."
    />
    <meta name="theme-color" content="#3195c9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IMS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Carbon &amp; Whale · IMS</title>
    <style>
      /* Bootscreen styles */
      #bootscreen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #3195c9 radial-gradient(circle at 50% 42%, #3bb8f2 0%, #3195c9 55%, #1f7dae 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter Variable", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      .boot-doodles {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.85;
      }
      .boot-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        animation: bootFadeIn 0.5s ease-out forwards;
      }
      .boot-icon-wrap {
        width: 110px;
        height: 110px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 16px 36px -8px rgba(0, 32, 54, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        animation: bootFloat 3s ease-in-out infinite;
      }
      .boot-icon-img {
        width: 76px;
        height: 76px;
        object-fit: contain;
      }
      .boot-title {
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
        text-shadow: 0 2px 8px rgba(0, 24, 40, 0.25);
      }
      .boot-subtitle {
        color: rgba(255, 255, 255, 0.88);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 24px;
        text-shadow: 0 1px 4px rgba(0, 24, 40, 0.2);
      }
      .boot-progress-track {
        width: 140px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
        position: relative;
      }
      .boot-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        animation: bootShimmer 1.4s ease-in-out infinite;
      }
      @keyframes bootFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes bootFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes bootShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bootscreen">
        <!-- Repeating Brand Doodles Pattern in Ocean Blue Tone -->
        <svg class="boot-doodles" xmlns="http://www.w3.org/2000/svg" fill="none">
          <defs>
            <pattern id="boot-cw-doodles" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
              <!-- Mini Recycled Plastic Bottle -->
              <g transform="translate(18, 14) rotate(12)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="2" width="6" height="3" rx="0.75" />
                <path d="M7 5 V8 C7 11 3 13 3 16 V32 C3 34.5 4.8 36 9 36 C13.2 36 15 34.5 15 32 V16 C15 13 11 11 11 8 V5" />
                <line x1="4" y1="20" x2="14" y2="20" stroke-dasharray="1.5 1" />
                <line x1="4" y1="26" x2="14" y2="26" stroke-dasharray="1.5 1" />
                <path d="M7.5 22.5 L9 21 L9.5 23.5" />
                <path d="M9 22 C10 23 9.5 24.5 8 25" />
              </g>
              <!-- Mini Geometric Whale -->
              <g transform="translate(68, 16) scale(0.015)" fill="rgba(255,255,255,0.28)" stroke="none">
                <polygon points="398,951 1371,848 1862,960 1904,1164 1731,1053 1257,1395 1111,1615 941,1429 400,1247" />
              </g>
              <!-- Mini Billboard -->
              <g transform="translate(122, 16)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="0" y="0" width="22" height="14" rx="1.5" />
                <line x1="4" y1="14" x2="4" y2="22" />
                <line x1="18" y1="14" x2="18" y2="22" />
                <circle cx="6" cy="5" r="1.5" fill="rgba(255,255,255,0.28)" />
                <path d="M10 10 L14 6 L18 10" />
              </g>
              <!-- Mini Leaf -->
              <g transform="translate(138, 52)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 14 C2 6 8 2 14 2 C14 8 10 14 2 14 Z" />
                <path d="M2 14 C6 10 10 6 14 2" />
              </g>
              <!-- Mini Droplet -->
              <g transform="translate(32, 60)" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" stroke-linecap="round">
                <path d="M6 2 C6 2 2 7 2 9 C2 11.2 3.8 13 6 13 C8.2 13 10 11.2 10 9 C10 7 6 2 6 2 Z" />
                <circle cx="16" cy="11" r="1.5" fill="rgba(255,255,255,0.28)" stroke="none" />
              </g>
              <!-- Mini Recycling Loop -->
              <g transform="translate(78, 62)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2 L13 6 L7 6 Z" fill="rgba(255,255,255,0.28)" />
                <path d="M10 5 C15 5 18 8 18 13" />
                <path d="M18 13 L15 15 L19 18 Z" fill="rgba(255,255,255,0.28)" />
                <path d="M17 14 C15 18 11 20 6 19" />
                <path d="M4 16 L2 12 L6 13 Z" fill="rgba(255,255,255,0.28)" />
                <path d="M4 14 C3 10 6 6 9 5" />
              </g>
              <!-- Mini Map Pin -->
              <g transform="translate(118, 86)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 1 C4.1 1 1 4.1 1 8 C1 13.5 8 19 8 19 C8 19 15 13.5 15 8 C15 4.1 11.9 1 8 1 Z" />
                <circle cx="8" cy="8" r="2.5" />
              </g>
              <!-- Mini Whale Tail Fluke -->
              <g transform="translate(14, 102)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 18 C12.5 13 9.5 10.5 4 9.5 C7 8.5 10.5 9.5 13 12.5 C15.5 9.5 19 8.5 22 9.5 C16.5 10.5 13.5 13 13 18 Z" />
                <circle cx="8" cy="4" r="1" fill="rgba(255,255,255,0.28)" stroke="none" />
                <circle cx="18" cy="4" r="1" fill="rgba(255,255,255,0.28)" stroke="none" />
              </g>
              <!-- Mini Wave -->
              <g transform="translate(54, 114)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round">
                <path d="M0 6 C4 3 8 9 12 6 C16 3 20 9 24 6" />
                <path d="M3 11 C7 8 11 14 15 11 C19 8 23 14 27 11" stroke-dasharray="1.5 1.5" />
              </g>
              <!-- Mini Clock -->
              <g transform="translate(94, 118)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="8" r="7" />
                <polyline points="8 4 8 8 11 10" />
              </g>
              <!-- Mini Sparkle -->
              <g transform="translate(138, 126)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-linecap="round">
                <line x1="6" y1="1" x2="6" y2="11" />
                <line x1="1" y1="6" x2="11" y2="6" />
              </g>
              <!-- Mini Bottle 2 -->
              <g transform="translate(68, 138) rotate(-20)" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="1" width="4" height="2" rx="0.5" />
                <path d="M4.5 3 V5 C4.5 7 2 8 2 10 V20 C2 21.5 3 22.5 6 22.5 C9 22.5 10 21.5 10 20 V10 C10 8 7.5 7 7.5 5 V3" />
              </g>
              <!-- Mini Wave 2 -->
              <g transform="translate(18, 146)" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" stroke-linecap="round">
                <path d="M0 4 C3 2 6 6 9 4 C12 2 15 6 18 4" />
              </g>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#boot-cw-doodles)" />
        </svg>

        <div class="boot-content">
          <div class="boot-icon-wrap">
            <img src="/brand/icon-192.png" alt="Carbon &amp; Whale" class="boot-icon-img" />
          </div>
          <h1 class="boot-title">Carbon &amp; Whale</h1>
          <div class="boot-subtitle">Outdoor Advertising IMS</div>
          <div class="boot-progress-track">
            <div class="boot-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
