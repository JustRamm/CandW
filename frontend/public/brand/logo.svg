<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Seamless Repeating Brand Doodles Pattern -->
    <pattern id="doodles-pattern" x="0" y="0" width="128" height="128" patternUnits="userSpaceOnUse">
      <!-- 1. Mini Recycled Plastic Bottle -->
      <g transform="translate(14, 10) rotate(12)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="5" y="1.5" width="5" height="2.5" rx="0.6" />
        <path d="M5.8 4 V6.5 C5.8 9 2.5 10.5 2.5 13 V26 C2.5 28 4 29.5 7.5 29.5 C11 29.5 12.5 28 12.5 26 V13 C12.5 10.5 9.2 9 9.2 6.5 V4" />
        <line x1="3.5" y1="16" x2="11.5" y2="16" stroke-dasharray="1.2 1" />
        <line x1="3.5" y1="21" x2="11.5" y2="21" stroke-dasharray="1.2 1" />
        <path d="M6 18.5 L7.5 17 L8 19.5" />
        <path d="M7.5 18 C8.5 19 8 20 6.8 20.5" />
      </g>

      <!-- 2. Mini Geometric Whale -->
      <g transform="translate(54, 12) scale(0.012)" fill="rgba(255,255,255,0.32)" stroke="none">
        <polygon points="398,951 1371,848 1862,960 1904,1164 1731,1053 1257,1395 1111,1615 941,1429 400,1247" />
      </g>

      <!-- 3. Mini Billboard -->
      <g transform="translate(98, 12)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="0" y="0" width="18" height="11" rx="1.2" />
        <line x1="3.5" y1="11" x2="3.5" y2="18" />
        <line x1="14.5" y1="11" x2="14.5" y2="18" />
        <circle cx="5" cy="4" r="1.2" fill="rgba(255,255,255,0.32)" />
        <path d="M8 8 L11.5 5 L14.5 8" />
      </g>

      <!-- 4. Mini Leaf -->
      <g transform="translate(110, 42)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M1.5 11 C1.5 5 6.5 1.5 11 1.5 C11 6.5 8 11 1.5 11 Z" />
        <path d="M1.5 11 C5 8 8 5 11 1.5" />
      </g>

      <!-- 5. Mini Droplet -->
      <g transform="translate(25, 48)" stroke="rgba(255,255,255,0.32)" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M5 1.5 C5 1.5 1.5 5.5 1.5 7.2 C1.5 9 3 10.5 5 10.5 C7 10.5 8.5 9 8.5 7.2 C8.5 5.5 5 1.5 5 1.5 Z" />
        <circle cx="13" cy="9" r="1.2" fill="rgba(255,255,255,0.32)" stroke="none" />
      </g>

      <!-- 6. Mini Recycling Loop -->
      <g transform="translate(62, 50)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M8 1.5 L10.5 5 L5.5 5 Z" fill="rgba(255,255,255,0.32)" />
        <path d="M8 4 C12 4 14.5 6.5 14.5 10.5" />
        <path d="M14.5 10.5 L12 12 L15.5 14.5 Z" fill="rgba(255,255,255,0.32)" />
        <path d="M13.5 11.5 C12 14.5 9 16 5 15" />
        <path d="M3 13 L1.5 9.5 L5 10.5 Z" fill="rgba(255,255,255,0.32)" />
        <path d="M3 11 C2.5 8 5 5 7 4" />
      </g>

      <!-- 7. Mini Map Pin -->
      <g transform="translate(94, 69)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M6.5 1 C3.5 1 1 3.5 1 6.5 C1 11 6.5 15.5 6.5 15.5 C6.5 15.5 12 11 12 6.5 C12 3.5 9.5 1 6.5 1 Z" />
        <circle cx="6.5" cy="6.5" r="2" />
      </g>

      <!-- 8. Mini Fluke Tail -->
      <g transform="translate(11, 82)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M10.5 14.5 C10 10.5 7.5 8.5 3 7.5 C5.5 7 8.5 7.5 10.5 10 C12.5 7.5 15.5 7 18 7.5 C13.5 8.5 11 10.5 10.5 14.5 Z" />
        <circle cx="6.5" cy="3.5" r="0.9" fill="rgba(255,255,255,0.32)" stroke="none" />
        <circle cx="14.5" cy="3.5" r="0.9" fill="rgba(255,255,255,0.32)" stroke="none" />
      </g>

      <!-- 9. Mini Wave -->
      <g transform="translate(43, 91)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" fill="none">
        <path d="M0 5 C3 2.5 6.5 7.5 9.5 5 C13 2.5 16 7.5 19 5" />
        <path d="M2.5 9 C5.5 6.5 9 11.5 12 9 C15 6.5 18.5 11.5 21.5 9" stroke-dasharray="1.2 1.2" />
      </g>

      <!-- 10. Mini Clock -->
      <g transform="translate(75, 94)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="6.5" cy="6.5" r="5.5" />
        <polyline points="6.5 3.5 6.5 6.5 9 8" />
      </g>

      <!-- 11. Mini Sparkle -->
      <g transform="translate(110, 101)" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" fill="none">
        <line x1="5" y1="1" x2="5" y2="9" />
        <line x1="1" y1="5" x2="9" y2="5" />
      </g>

      <!-- 12. Mini Bottle 2 -->
      <g transform="translate(54, 110) rotate(-20)" stroke="rgba(255,255,255,0.32)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="3" y="1" width="3.5" height="1.8" rx="0.4" />
        <path d="M3.5 2.5 V4 C3.5 5.5 1.5 6.5 1.5 8 V16 C1.5 17.2 2.5 18 5 18 C7.5 18 8.5 17.2 8.5 16 V8 C8.5 6.5 6.5 5.5 6.5 4 V2.5" />
      </g>

      <!-- 13. Mini Wave 2 -->
      <g transform="translate(14, 117)" stroke="rgba(255,255,255,0.32)" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M0 3.5 C2.5 2 5 5 7.5 3.5 C10 2 12.5 5 15 3.5" />
      </g>
    </pattern>

    <!-- Subtle Drop Shadow on Whale -->
    <filter id="whale-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001826" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- 1. Solid Ocean Blue Base Background (#3195c9) -->
  <rect width="512" height="512" fill="#3195c9" />

  <!-- 2. Seamless Full-Bleed Doodles Pattern Layer -->
  <rect width="512" height="512" fill="url(#doodles-pattern)" />

  <!-- 3. Centered Geometric Whale Logo -->
  <g transform="translate(256, 256) scale(0.205) translate(-1027, -1098)" filter="url(#whale-shadow)">
    <!-- Black Whale Body -->
    <polygon
      points="398,951 1371,848 1862,960 1904,1164 1731,1053 1257,1395 1111,1615 941,1429 400,1247"
      fill="#000000"
    />
    <!-- White Belly Patch -->
    <polygon
      points="397,1197 776,1182 941,1429 400,1247"
      fill="#FFFFFF"
    />
    <!-- White Eye -->
    <circle
      cx="499.4"
      cy="1054.9"
      r="28.7"
      fill="#FFFFFF"
    />
  </g>
</svg>